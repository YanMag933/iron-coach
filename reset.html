<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс кэша — IRON COACH</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        background: #0a0a0a;
        color: #f2f2f2;
        font-family: "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        color: #9a9a9a;
        line-height: 1.45;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 20px;
        background: #e10600;
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Обновляю приложение…</h1>
    <p id="msg">Очищаю старый кэш.</p>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          localStorage.setItem("iron-coach-ver", "7");
          document.getElementById("msg").textContent = "Готово. Открываю приложение…";
          setTimeout(() => {
            location.replace("./index.html?v=7");
          }, 400);
        } catch (e) {
          document.getElementById("msg").textContent =
            "Не удалось автоматически. Очисти данные сайта вручную в настройках браузера.";
          const a = document.createElement("a");
          a.href = "./index.html?v=7";
          a.textContent = "Открыть приложение";
          document.body.appendChild(a);
        }
      })();
    </script>
  </body>
</html>
