<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Личный фитнес-коуч: турник, брусья, блины, пресс" />
    <title>IRON COACH</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="css/styles.css?v=6" />
    <script>
      // Если залип старый service worker — один раз сбрасываем кэш
      (function () {
        var VER = "6";
        try {
          if (localStorage.getItem("iron-coach-ver") === VER) return;
          localStorage.setItem("iron-coach-ver", VER);
          if (!("serviceWorker" in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
              return caches.keys();
            }).then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              location.replace("./reset.html");
            });
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="shell" class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PERSONAL TRAINER</p>
          <h1 id="top-title">IRON COACH</h1>
        </div>
        <button type="button" id="install-btn" class="btn ghost" hidden>Установить</button>
      </header>

      <main id="app" class="content" aria-live="polite"></main>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Разделы" hidden>
        <button type="button" class="nav-btn active" data-tab="today">
          <span class="nav-ico" aria-hidden="true">◆</span><span>Сегодня</span>
        </button>
        <button type="button" class="nav-btn" data-tab="program">
          <span class="nav-ico" aria-hidden="true">☰</span><span>Программа</span>
        </button>
        <button type="button" class="nav-btn" data-tab="log">
          <span class="nav-ico" aria-hidden="true">≡</span><span>Журнал</span>
        </button>
        <button type="button" class="nav-btn" data-tab="profile">
          <span class="nav-ico" aria-hidden="true">◎</span><span>Профиль</span>
        </button>
      </nav>
    </div>

    <script src="js/exercises.js?v=6"></script>
    <script src="js/muscles.js?v=6"></script>
    <script src="js/coach.js?v=6"></script>
    <script src="js/storage.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
  </body>
</html>
